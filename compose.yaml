# Sans Comic. A static site on nginx.
#
#   docker compose up -d --build
#   then open http://localhost:8080
#
# Set HOST_PORT to publish a different host port.
name: sans-comic

services:
  sans-comic:
    build: .
    image: sans-comic:local
    container_name: sans-comic
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${HOST_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777,noexec,nosuid,nodev
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.50
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "3" }
